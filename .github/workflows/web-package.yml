name: EFK Vorstellungsrunde pruefen und packen
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP-Syntax prÃ¼fen
        run: find web -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Speichern und Auswertung testen
        run: python3 tests/integration.py
      - name: Web-Paket erstellen
        run: |
          mkdir -p build
          cd web
          zip -r ../build/TCS_EFK_Vorstellungsrunde_Web.zip . -x 'data/answers.php'
      - uses: actions/upload-artifact@v4
        with:
          name: TCS-EFK-Vorstellungsrunde-Web
          path: build/TCS_EFK_Vorstellungsrunde_Web.zip
          retention-days: 30
